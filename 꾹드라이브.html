<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>꾹드라이브 (Gguk Drive)</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid var(--border); }
    h1 { color: var(--primary); display: flex; align-items: center; gap: 8px; }
    
    .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border); }
    .card h3 { margin-bottom: 12px; font-size: 1.1rem; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #475569; }
    input[type="file"], select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; margin-bottom: 12px; }
    
    button { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    button:hover { background: var(--primary-hover); }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    button.secondary { background: #64748b; }
    button.secondary:hover { background: #475569; }
    button.danger { background: #ef4444; }
    button.danger:hover { background: #dc2626; }
    button.sm { padding: 6px 10px; font-size: 0.8rem; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { background: #f1f5f9; color: #475569; font-weight: 600; }
    
    .actions { display: flex; gap: 6px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
    .badge-time { background: #e0e7ff; color: #3730a3; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 24px; border-radius: 12px; width: 90%; max-width: 500px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>💾 꾹드라이브 (Gguk Drive)</h1>
    <div><small id="user-id-display">사용자 ID 확인 중...</small></div>
  </header>

  <!-- 저장 용량 현황 -->
  <div class="card">
    <h3>현재 업로드된 총용량 (쇼츠/영상 보관 가능)</h3>
    <div style="font-size: 1.2rem; font-weight: bold; color: var(--primary); margin-top: 8px;" id="total-usage-text">0 MB 업로드됨</div>
  </div>

  <!-- 파일 업로드 카드 -->
  <div class="card">
    <h3>파일 업로드</h3>
    <div class="grid-2">
      <div>
        <label>보관 서비스 엔진</label>
        <select disabled>
          <option>Catbox + CORS Bypass Proxy</option>
        </select>
      </div>
      <div>
        <label>파일 선택 (최대 200MB / 쇼츠 및 영상 가능)</label>
        <input type="file" id="file-input">
      </div>
    </div>
    <button id="upload-btn" onclick="handleUpload()">파일 업로드하기</button>
  </div>

  <!-- 파일 목록 카드 -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>내 파일 목록</h3>
      <button class="danger sm" onclick="clearAllCache()">전체 목록 초기화</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>파일명</th>
          <th>용량</th>
          <th>상태</th>
          <th>작업</th>
        </tr>
      </thead>
      <tbody id="file-list">
      </tbody>
    </table>
  </div>
</div>

<!-- 파일 편집 모달 -->
<div id="edit-modal" class="modal">
  <div class="modal-content">
    <h3>파일 메모 / 상세 정보 편집</h3>
    <input type="hidden" id="edit-file-id">
    <textarea id="edit-text-content" rows="8" placeholder="파일 정보나 메모를 입력하세요..."></textarea>
    <div style="display: flex; justify-content: flex-end; gap: 8px;">
      <button class="secondary" onclick="closeEditModal()">취소</button>
      <button onclick="saveFileEdit()">저장</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'gguk_drive_files_cache';
  const USER_KEY = 'gguk_drive_user_id';

  let userId = localStorage.getItem(USER_KEY);
  if (!userId) {
    userId = 'user_' + Math.random().toString(36).substring(2, 9);
    localStorage.setItem(USER_KEY, userId);
  }
  document.getElementById('user-id-display').innerText = `사용자 ID: ${userId}`;

  function getCachedFiles() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  }

  function saveCachedFiles(files) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
    renderFileList();
    updateStorageUI();
  }

  function updateStorageUI() {
    const files = getCachedFiles();
    const totalBytes = files.reduce((acc, file) => acc + (file.size || 0), 0);
    const mbUsed = (totalBytes / (1024 * 1024)).toFixed(2);
    const gbUsed = (totalBytes / (1024 * 1024 * 1024)).toFixed(2);

    if (totalBytes > 1024 * 1024 * 1024) {
      document.getElementById('total-usage-text').innerText = `현재 총 ${gbUsed} GB 업로드됨`;
    } else {
      document.getElementById('total-usage-text').innerText = `현재 총 ${mbUsed} MB 업로드됨`;
    }
  }

  function renderFileList() {
    const files = getCachedFiles();
    const tbody = document.getElementById('file-list');
    tbody.innerHTML = '';

    if (files.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#94a3b8;">저장된 파일이 없습니다.</td></tr>';
      return;
    }

    files.forEach(file => {
      const tr = document.createElement('tr');
      const mbSize = (file.size / (1024 * 1024)).toFixed(2);
      
      tr.innerHTML = `
        <td><strong>${file.name}</strong></td>
        <td>${mbSize} MB</td>
        <td><span class="badge badge-time">공유 가능</span></td>
        <td class="actions">
          <button class="sm" onclick="downloadFile('${file.url}')">다운로드</button>
          <button class="sm secondary" onclick="shareLink('${file.url}')">공유</button>
          <button class="sm secondary" onclick="openEditModal('${file.id}')">편집</button>
          <button class="sm danger" onclick="deleteFile('${file.id}')">삭제</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function handleUpload() {
    const fileInput = document.getElementById('file-input');
    const uploadBtn = document.getElementById('upload-btn');

    if (!fileInput.files[0]) return alert('파일을 선택해주세요.');
    
    const file = fileInput.files[0];

    if (file.size > 200 * 1024 * 1024) {
      return alert('단일 파일 최대 200MB까지 가능합니다.');
    }

    uploadBtn.disabled = true;
    uploadBtn.innerText = '⏳ 영상/파일 저장 중...';

    try {
      const formData = new FormData();
      formData.append('reqtype', 'fileupload');
      formData.append('fileToUpload', file);

      // CORS 헤더 우회 프록시 적용
      const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent('https://catbox.moe/user/api.php');

      const res = await fetch(proxyUrl, {
        method: 'POST',
        body: formData
      });

      if (!res.ok) {
        throw new Error(`서버 응답 오류 (${res.status})`);
      }

      const fileUrl = (await res.text()).trim();

      if (!fileUrl.startsWith('http')) {
        throw new Error('업로드 처리 실패');
      }

      const files = getCachedFiles();
      files.push({
        id: 'file_' + Date.now(),
        name: file.name,
        size: file.size,
        url: fileUrl,
        createdAt: new Date().toISOString()
      });

      saveCachedFiles(files);
      alert('업로드 성공!');
      fileInput.value = '';

    } catch (err) {
      alert('업로드 오류: ' + err.message);
      console.error(err);
    } finally {
      uploadBtn.disabled = false;
      uploadBtn.innerText = '파일 업로드하기';
    }
  }

  function deleteFile(id) {
    if (!confirm('목록에서 삭제하시겠습니까?')) return;
    const files = getCachedFiles().filter(f => f.id !== id);
    saveCachedFiles(files);
  }

  function downloadFile(url) {
    window.open(url, '_blank');
  }

  function shareLink(url) {
    navigator.clipboard.writeText(url);
    alert('공유 링크가 클립보드에 복사되었습니다:\n' + url);
  }

  function clearAllCache() {
    if (!confirm('목록을 초기화하시겠습니까?')) return;
    localStorage.removeItem(STORAGE_KEY);
    renderFileList();
    updateStorageUI();
  }

  function openEditModal(id) {
    const file = getCachedFiles().find(f => f.id === id);
    if (!file) return;

    document.getElementById('edit-file-id').value = id;
    document.getElementById('edit-text-content').value = file.memo || `[${file.name}]\n다운로드 링크: ${file.url}`;
    document.getElementById('edit-modal').style.display = 'flex';
  }

  function closeEditModal() {
    document.getElementById('edit-modal').style.display = 'none';
  }

  function saveFileEdit() {
    const id = document.getElementById('edit-file-id').value;
    const text = document.getElementById('edit-text-content').value;
    
    const files = getCachedFiles();
    const file = files.find(f => f.id === id);
    if (file) {
      file.memo = text;
      saveCachedFiles(files);
      alert('저장되었습니다.');
    }
    closeEditModal();
  }

  renderFileList();
  updateStorageUI();
</script>

</body>
</html>
